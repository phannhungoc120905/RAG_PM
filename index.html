<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Upload & Control -->
        <div class="lg:col-span-1 space-y-6">
            <div class="glass p-6 rounded-2xl shadow-2xl">
                <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                    <i class="fas fa-file-pdf text-red-500 mr-3"></i> AI Summarizer
                </h1>
                
                <div id="drop-zone" class="border-2 border-dashed border-blue-400 rounded-xl p-8 text-center hover:bg-blue-50 transition-all cursor-pointer">
                    <input type="file" id="fileInput" class="hidden" accept=".pdf">
                    <i class="fas fa-cloud-upload-alt text-4xl text-blue-500 mb-3"></i>
                    <p class="text-gray-600">Kéo thả hoặc tóm tắt PDF</p>
                </div>
                
                <button id="uploadBtn" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-all flex items-center justify-center">
                    <i class="fas fa-magic mr-2"></i> Tóm tắt ngay
                </button>
            </div>

            <!-- History Section -->
            <div class="glass p-6 rounded-2xl shadow-2xl overflow-hidden">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-history text-gray-500 mr-3"></i> Lịch sử
                </h2>
                <div id="historyList" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </div>

        <!-- Right Column: Result Output -->
        <div class="lg:col-span-2">
            <div class="glass p-8 rounded-2xl shadow-2xl h-full flex flex-col min-h-[500px]">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800 italic" id="statusText">Sẵn sàng xử lý...</h2>
                    <div id="loading" class="hidden">
                        <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </div>
                
                <div id="resultContent" class="prose prose-blue max-w-none text-gray-700 whitespace-pre-wrap leading-relaxed flex-grow">
                    Vui lòng chọn một file PDF để bắt đầu tóm tắt bằng mô hình Llama 3.2 Offline.
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultContent = document.getElementById('resultContent');
        const statusText = document.getElementById('statusText');
        const loading = document.getElementById('loading');
        const historyList = document.getElementById('historyList');

        // Drag & Drop
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-50'); };
        dropZone.ondragleave = () => dropZone.classList.remove('bg-blue-50');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-50');
            fileInput.files = e.dataTransfer.files;
        };

        // Load History
        async function fetchHistory() {
            try {
                const res = await fetch('/history');
                const data = await res.json();
                historyList.innerHTML = data.map((item, index) => `
                    <div onclick="viewHistory(${index})" class="p-3 bg-white/50 rounded-lg border border-gray-200 cursor-pointer hover:bg-white transition-all">
                        <p class="font-semibold text-sm truncate text-gray-800">${item.filename}</p>
                        <p class="text-xs text-gray-500">${item.timestamp}</p>
                    </div>
                `).join('');
                window._history = data;
            } catch (err) { console.error(err); }
        }

        window.viewHistory = (index) => {
            const item = window._history[index];
            statusText.innerText = "Lịch sử: " + item.filename;
            resultContent.innerText = item.summary;
        };

        // Upload
        uploadBtn.onclick = async () => {
            if (!fileInput.files[0]) return alert('Vui lòng chọn file!');
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            loading.classList.remove('hidden');
            statusText.innerText = "Đang xử lý...";
            resultContent.innerText = "";
            
            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.summary) {
                    resultContent.innerText = data.summary;
                    statusText.innerText = "Hoàn tất: " + fileInput.files[0].name;
                    fetchHistory();
                } else {
                    resultContent.innerText = "Lỗi: " + JSON.stringify(data.error);
                }
            } catch (err) {
                resultContent.innerText = "Lỗi kết nối server!";
            } finally {
                loading.classList.add('hidden');
            }
        };

        fetchHistory();
    </script>
</body>
</html>
